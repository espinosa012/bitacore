<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vg-task-manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/modals.css" />
</head>
<body>

  <!-- Application Header -->
  <header>
    <div class="brand-section">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
      </div>
      <div>
        <div class="brand-title">vg-task-manager</div>
        <div class="brand-subtitle" id="taskStatsCounter">0 tasks · 0 in progress · 0 blocked</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <!-- Search Input -->
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.395 1.414-1.414-4.395-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search tasks or files... ( / )" autocomplete="off" aria-label="Search tasks" />
      </div>

      <!-- Priority Filter -->
      <select id="priorityFilter" class="filter-select" aria-label="Filter by priority">
        <option value="all">All priorities</option>
        <option value="blocker">⛔ Blocker</option>
        <option value="high">🔥 High</option>
        <option value="medium-high">⚡ Medium-High</option>
        <option value="medium">🔹 Medium</option>
        <option value="low">🌱 Low</option>
      </select>

      <!-- Folder Sync Status Badge -->
      <div id="folderStatusBadge" class="folder-status-badge" title="Live synchronization status with local folder">
        <span class="status-dot" id="folderDot"></span>
        <span id="folderLabel">Standalone</span>
      </div>

      <!-- Select / Link Local Folder -->
      <button id="btnOpenFolder" class="btn btn-secondary" title="Select a local folder with tasks.json and attachments/. Live sync in Chrome/Edge, or in any browser with the local agent (npm start)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        <span>Open Folder</span>
      </button>

      <!-- Upload (JSON or ZIP) -->
      <input type="file" id="fileInputPicker" accept=".json,.zip" style="display:none" />
      <button id="btnUpload" class="btn btn-secondary" title="Upload a tasks.json or tasks.zip file">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        <span>Upload</span>
      </button>

      <!-- Download ZIP (tasks.json + attachments/) -->
      <button id="btnDownloadZip" class="btn btn-secondary" title="Download complete package as ZIP (tasks.json and attachments/<taskId>/ folders)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        <span>Download ZIP</span>
      </button>

      <!-- Download JSON (tasks.json only) -->
      <button id="btnDownloadJson" class="btn btn-secondary" title="Download tasks.json only">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>Download JSON</span>
      </button>

      <!-- Clear Board Button -->
      <button id="btnClearBoard" class="btn btn-secondary btn-danger-hover" title="Clear all tasks from the board">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        <span>Clear</span>
      </button>

      <!-- New Task Button -->
      <button id="btnNewTask" class="btn btn-primary" title="Create a new task (N)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
        <span>New Task</span>
      </button>
    </div>
  </header>

  <!-- Kanban Board -->
  <main>
    <div class="board" id="kanbanBoard">
      <!-- Columns rendered dynamically -->
    </div>
  </main>

  <!-- MODAL: Create Task -->
  <div class="modal-overlay" id="modalCreateOverlay">
    <div class="modal modal-create">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <h2 class="modal-title">New Task</h2>
        </div>
        <button class="modal-close-btn" id="closeCreateModalBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <form id="createTaskForm">
        <div class="modal-body" style="flex-direction: column;">
          <div class="form-group">
            <label for="newTaskName">Task Title *</label>
            <input type="text" id="newTaskName" class="form-control" placeholder="e.g. Implement crafting menu" required autocomplete="off" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="newTaskPriority">Priority</label>
              <select id="newTaskPriority" class="form-control">
                <option value="medium" selected>🔹 Medium</option>
                <option value="low">🌱 Low</option>
                <option value="medium-high">⚡ Medium-High</option>
                <option value="high">🔥 High</option>
                <option value="blocker">⛔ Blocker</option>
              </select>
            </div>

            <div class="form-group">
              <label for="newTaskState">Column / Status</label>
              <select id="newTaskState" class="form-control">
                <option value="planned" selected>📋 Planned</option>
                <option value="in progress">⚡ In Progress</option>
                <option value="in review">🔍 In Review</option>
                <option value="done">✅ Done</option>
                <option value="blocked">⛔ Blocked</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="newTaskOpenspecId">OpenSpec ID (Optional)</label>
            <input type="text" id="newTaskOpenspecId" class="form-control" placeholder="e.g. add-crafting-menu" autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="newTaskDesc">Description (Optional)</label>
            <textarea id="newTaskDesc" class="form-control" rows="3" placeholder="Add detailed notes or requirements..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <div></div>
          <div class="modal-footer-right">
            <button type="button" class="btn btn-secondary" id="cancelCreateBtn">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Task</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Edit Task & Attachments -->
  <div class="modal-overlay" id="modalEditOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <h2 class="modal-title">Edit Task</h2>
          <span class="modal-task-id" id="editTaskIdLabel">#000000</span>
        </div>
        <button class="modal-close-btn" id="closeEditModalBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Left Main Area -->
        <div class="modal-main">
          <div class="form-group">
            <label for="editTaskName">Task Title</label>
            <input type="text" id="editTaskName" class="form-control" required autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="editTaskDesc">Description</label>
            <textarea id="editTaskDesc" class="form-control" rows="3" placeholder="Task details and context..."></textarea>
          </div>

          <div class="form-group">
            <label for="editTaskOpenspecId">OpenSpec ID</label>
            <input type="text" id="editTaskOpenspecId" class="form-control" placeholder="e.g. add-straw" autocomplete="off" />
          </div>

          <!-- Tabs Header -->
          <div class="modal-tabs">
            <button type="button" class="tab-btn active" id="tabBtnAttachments">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              <span>Attachments (0)</span>
            </button>
            <button type="button" class="tab-btn" id="tabBtnComments">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
              <span>Comments (0)</span>
            </button>
            <button type="button" class="tab-btn" id="tabBtnHistory">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
              <span>History (0)</span>
            </button>
          </div>

          <!-- Tab Content: Attachments -->
          <div class="tab-content active" id="tabAttachments">
            <div class="attachments-container">
              <div class="attachments-list" id="attachmentsList">
                <!-- Attachment cards rendered dynamically -->
              </div>

              <!-- Upload New Attachment -->
              <div class="attachment-upload-box">
                <div class="attachment-upload-title">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                  <span>Attach New File</span>
                </div>

                <input type="file" id="newAttachmentFile" style="display:none;" />
                <div class="attachment-drop-zone" id="attachmentDropZone">
                  <svg class="attachment-drop-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5l5-5 5 5m-5-5v12"/></svg>
                  <div class="attachment-drop-text">Drag & drop a file here or <span>browse from computer</span></div>
                </div>

                <div class="form-row">
                  <input type="text" id="newAttachmentName" class="form-control" placeholder="Display title (optional)" autocomplete="off" />
                  <input type="text" id="newAttachmentDesc" class="form-control" placeholder="Short description (optional)" autocomplete="off" />
                </div>

                <div style="display: flex; justify-content: flex-end;">
                  <button type="button" class="btn btn-secondary" id="btnSubmitAttachment">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                    <span>Attach to Task</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Tab Content: Comments -->
          <div class="tab-content" id="tabComments">
            <div class="comment-list" id="commentsList">
              <!-- Comments rendered dynamically -->
            </div>

            <form id="addCommentForm" class="comment-add-box">
              <div class="form-row">
                <input type="text" id="newCommentAuthor" class="form-control" placeholder="Your name" value="OpenCode" autocomplete="off" />
              </div>
              <textarea id="newCommentText" class="form-control" rows="2" placeholder="Write a comment..." required></textarea>
              <div style="display: flex; justify-content: flex-end;">
                <button type="submit" class="btn btn-secondary">Post Comment</button>
              </div>
            </form>
          </div>

          <!-- Tab Content: History -->
          <div class="tab-content" id="tabHistory">
            <div class="history-timeline" id="historyTimeline">
              <!-- History entries rendered dynamically -->
            </div>
          </div>
        </div>

        <!-- Right Sidebar Area -->
        <div class="modal-sidebar">
          <div class="form-group">
            <label for="editTaskState">Status</label>
            <select id="editTaskState" class="form-control">
              <option value="planned">📋 Planned</option>
              <option value="in progress">⚡ In Progress</option>
              <option value="in review">🔍 In Review</option>
              <option value="done">✅ Done</option>
              <option value="blocked">⛔ Blocked</option>
            </select>
          </div>

          <div class="form-group">
            <label for="editTaskPriority">Priority</label>
            <select id="editTaskPriority" class="form-control">
              <option value="blocker">⛔ Blocker</option>
              <option value="high">🔥 High</option>
              <option value="medium-high">⚡ Medium-High</option>
              <option value="medium">🔹 Medium</option>
              <option value="low">🌱 Low</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="btnDeleteTask">Delete Task</button>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnSaveTask" title="Save changes (Ctrl/Cmd+Enter)">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="jszip.min.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/attachments.js"></script>
  <script src="js/zip-manager.js"></script>
  <script src="js/fs-sync.js"></script>
  <script src="js/board.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
